{% extends 'base.html' %}
{% load static %}
{% block content %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .metier-card {
            border-radius: 8px;
            padding: 12px;
            background-color: #e8f5e9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .metier-card:hover {
            transform: scale(1.05);
        }
        a.metier-link {
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
        }
        .search-container {
            width: 100%;
            max-width: 100%;
        }
        @media (min-width: 576px) {
            .search-container {
                max-width: 300px;
            }
        }
    </style>


<body>


    <!-- ✅ Titre + Recherche -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
        <h2 class="text-center w-100">💼 Liste des Métiers</h2>
        <div class="input-group search-container mx-auto">
            <input type="text" id="search" class="form-control" placeholder="🔍 Rechercher un métier">
            <button class="btn btn-outline-primary" type="button">
                <i class="bi bi-search">VALIDE</i>
            </button>
        </div>
    </div>

    <!-- ✅ Liste des métiers -->
    <div class="row justify-content-center" id="metier-list">
        {% for m in metier %}
        <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3 metier-item">
            <div class="metier-card text-center">
                <a href="{% url 'list_personnel' %}?id={{ m.id }}" class="metier-link">
                    {{ m.nomm }}
                </a>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- ✅ Bouton Retour -->
    <div class="text-center mt-4">
        <a href="javascript:history.back()" class="btn btn-info text-white px-4 py-2 rounded-pill">
            ⬅ Retour
        </a>
    </div>
</div>

<!-- ✅ Script de recherche -->
<script>
    $(document).ready(function() {
        $('#search').on('keyup', function() {
            const query = $(this).val().toLowerCase();
            $('.metier-item').filter(function() {
                $(this).toggle($(this).text().toLowerCase().includes(query));
            });
        });
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

{% endblock %}
