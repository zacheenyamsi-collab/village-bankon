{% extends 'base.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique du Village</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

    {% if ville %}
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>📜 Historique de <strong>{{ ville.nomv }}</strong></span>
                <a href="{% url 'pagea' %}" class="btn btn-primary btn-sm">
                    ⬅ Retour
                </a>
            </div>
            <div class="card-body">
                <p class="card-text fs-5 text-muted">
                    {{ ville.histoire }}
                </p>
            </div>
        </div>

    {% elif erreur %}
        <div class="alert alert-warning text-center mt-4">
            {{ erreur }}
        </div>
    {% endif %}

</div>

<!-- Bootstrap JS (optionnel, si tu veux du JS dynamique plus tard) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
