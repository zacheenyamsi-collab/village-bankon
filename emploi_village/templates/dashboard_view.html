{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de Bord</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">📊 Tableau de Bord</h1>

    <div class="row">
        <!-- 📈 Graphique: Répartition par village -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">Répartition des personnels par village</h5>
                    <canvas id="chartVillage"></canvas>
                </div>
            </div>
        </div>

        <!-- 📉 Graphique: Répartition par métier -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">Répartition des personnels par métier</h5>
                    <canvas id="chartMetier"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const villageData = {
        labels: {{ village_labels|safe }},
        datasets: [{
            label: 'Nombre de personnes',
            data: {{ village_data|safe }},
            backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6f42c1']
        }]
    };

    const metierData = {
        labels: {{ metier_labels|safe }},
        datasets: [{
            label: 'Nombre de personnes',
            data: {{ metier_data|safe }},
            backgroundColor: ['#20c997', '#ff6384', '#36a2eb', '#ffcd56', '#9966ff']
        }]
    };

    new Chart(document.getElementById('chartVillage'), {
        type: 'bar',
        data: villageData
    });

    new Chart(document.getElementById('chartMetier'), {
        type: 'pie',
        data: metierData
    });
</script>

</body>
</html>
