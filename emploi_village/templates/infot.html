{% extends 'base.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village BANKOM</title>

    <!-- ✅ Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ✅ Ton CSS personnalisé -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<!-- ✅ Corps de la page -->
<main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-4 text-center text-primary">
                        🔎 Rechercher un village
                    </h2>

                    <form method="get" action="{% url 'affiche_village' %}">
                        <div class="mb-3">
                            <input list="villes" name="ville"
                                   class="form-control form-control-lg"
                                   placeholder="Tapez le nom du village..."
                                   required autofocus>
                            <datalist id="villes">
                                {% for ville in ville_list %}
                                    <option value="{{ ville.nomv }}">
                                {% endfor %}
                            </datalist>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                Voir Information
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
