<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription - Recherche d'emploi / Proposition de personnel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .section {
            margin-top: 40px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: #fff;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur notre plateforme d'emploi</h1>
    </header>
    <div class="container">
        <h2>Inscription pour chercher du travail</h2>
        <form action="#" method="post">
            <label for="name">Nom complet</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="profession">Domaine / Profession</label>
            <input type="text" id="profession" name="profession" />

            <button type="submit">S'inscrire en tant que chercheur d'emploi</button>
        </form>

        <div class="section"></div>

        <h2>Inscription pour proposer du personnel</h2>
        <form action="#" method="post">
            <label for="company">Nom de l'entreprise</label>
            <input type="text" id="company" name="company" required />

            <label for="contact">Contact (Email ou téléphone)</label>
            <input type="text" id="contact" name="contact" />

            <label for="skills">Compétences / Postes proposés</label>
            <input type="text" id="skills" name="skills" />

            <button type="submit">S'inscrire en tant que recruteur</button>
        </form>
    </div>
    <footer>
        &copy; 2025 Plateforme d'emploi. Tous droits réservés.
    </footer>
</body>
</html>
